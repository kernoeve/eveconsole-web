<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EVE Console — Connecting to Slack…</title>
<style>
  :root{
    --ground:#0b0b0f; --panel:#13131c; --line:#242433; --line-2:#2f2f42;
    --amber:#c8a84b; --text:#c9c9d6; --head:#ececf2; --muted:#7a7a8c; --faint:#565667;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%,#16161f 0%,var(--ground) 60%);
    font-family:var(--sans); color:var(--text);
  }
  .card{
    width:460px; max-width:90vw; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:40px 44px 36px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .brand{font-size:22px; font-weight:800; letter-spacing:.1em; margin-bottom:22px}
  .brand .eve{color:var(--head)} .brand .console{color:var(--amber)}
  .spinner{
    width:28px; height:28px; margin:0 auto 20px; border-radius:50%;
    border:3px solid var(--line-2); border-top-color:var(--amber);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{color:var(--head); font-size:18px; font-weight:600; margin:0 0 10px}
  p{font-size:13.5px; line-height:21px; margin:0; color:var(--text)}
  .hint{color:var(--faint); font-size:11.5px; margin-top:20px; font-family:var(--mono)}
  a{color:var(--amber)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="eve">EVE</span> <span class="console">CONSOLE</span></div>
  <div class="spinner"></div>
  <h1>Connecting to Slack…</h1>
  <p>Finishing up on your computer — make sure EVE Console is running.</p>
  <p class="hint">If nothing happens, <a id="fallback" href="#">click here to continue</a>.</p>
</div>
<script>
  // Slack's redirect lands here (a public HTTPS URL, required for app distribution) carrying
  // ?code=&state= (or ?error=&state= on cancel). EVE Console listens locally on this port —
  // this page just forwards the query string on to the desktop app and gets out of the way.
  // The code is useless to anyone else without the PKCE verifier, which never leaves the app.
  var target = 'http://localhost:5051/slack/callback' + window.location.search;
  document.getElementById('fallback').href = target;
  window.location.replace(target);
</script>
</body>
</html>
